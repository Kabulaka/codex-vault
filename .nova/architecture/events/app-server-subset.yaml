asyncapi: 3.0.0
info:
  title: Codex Vault app-server protocol subset
  version: 1.5.0
  description: >-
    Capability-driven JSON-RPC subset used by Codex Vault. Managed mode uses
    JSONL over app-server stdio. Attached mode performs the app-server
    WebSocket handshake and exchanges text frames through the official
    app-server proxy connected to the current-host Unix control socket. Auto
    mode attaches when that socket exists and otherwise starts a Vault-managed
    app-server stdio process. An existing but unusable control socket fails
    closed instead of creating a second app-server. The current-host Codex
    SQLite catalog is the discovery and relationship authority; app-server
    list/read only enrich catalogued IDs with runtime metadata and may not
    narrow historical coverage. This protocol subset is read-only; archive,
    unarchive, and delete are delegated to the current-host official Codex CLI.
    Unknown fields are accepted; missing required runtime capabilities or CLI
    commands protect the affected scope. A catalogued ID omitted by thread/list
    is read with includeTurns=false; unavailable runtime metadata remains
    protected rather than disappearing. Relationship or source failures with a
    proven tree scope protect that tree; ambiguity that may affect any
    interactive tree disables all writes. Incomplete observations remain
    unknown.
defaultContentType: application/json
channels:
  clientToServer:
    address: stdin
    messages:
      initializeRequest:
        $ref: '#/components/messages/InitializeRequest'
      initializedNotification:
        $ref: '#/components/messages/InitializedNotification'
      threadListRequest:
        $ref: '#/components/messages/ThreadListRequest'
      threadReadRequest:
        $ref: '#/components/messages/ThreadReadRequest'
  serverToClient:
    address: stdout
    messages:
      response:
        $ref: '#/components/messages/Response'
      threadNotification:
        $ref: '#/components/messages/ThreadNotification'
operations:
  sendRequests:
    action: send
    channel:
      $ref: '#/channels/clientToServer'
    messages:
      - $ref: '#/channels/clientToServer/messages/initializeRequest'
      - $ref: '#/channels/clientToServer/messages/initializedNotification'
      - $ref: '#/channels/clientToServer/messages/threadListRequest'
      - $ref: '#/channels/clientToServer/messages/threadReadRequest'
  receiveResponses:
    action: receive
    channel:
      $ref: '#/channels/serverToClient'
    messages:
      - $ref: '#/channels/serverToClient/messages/response'
      - $ref: '#/channels/serverToClient/messages/threadNotification'
components:
  messages:
    InitializeRequest:
      payload:
        $ref: '#/components/schemas/InitializeRequest'
    InitializedNotification:
      payload:
        $ref: '#/components/schemas/InitializedNotification'
    ThreadListRequest:
      payload:
        $ref: '#/components/schemas/ThreadListRequest'
    ThreadReadRequest:
      payload:
        $ref: '#/components/schemas/ThreadReadRequest'
    Response:
      payload:
        $ref: '#/components/schemas/Response'
    ThreadNotification:
      payload:
        $ref: '#/components/schemas/ThreadNotification'
  schemas:
    RequestEnvelope:
      type: object
      required: [method, id, params]
      properties:
        method:
          type: string
        id:
          oneOf:
            - type: integer
            - type: string
        params:
          type: object
      additionalProperties: true
    InitializeRequest:
      allOf:
        - $ref: '#/components/schemas/RequestEnvelope'
        - type: object
          properties:
            method:
              const: initialize
            params:
              type: object
              required: [clientInfo]
              properties:
                clientInfo:
                  type: object
                  required: [name, title, version]
                  properties:
                    name:
                      const: codex_vault
                    title:
                      const: Codex Vault
                    version:
                      type: string
                capabilities:
                  type: object
                  properties:
                    experimentalApi:
                      type: boolean
                  additionalProperties: true
              additionalProperties: true
    InitializedNotification:
      type: object
      required: [method, params]
      properties:
        method:
          const: initialized
        params:
          type: object
      additionalProperties: true
    ThreadListRequest:
      allOf:
        - $ref: '#/components/schemas/RequestEnvelope'
        - type: object
          properties:
            method:
              const: thread/list
            params:
              type: object
              properties:
                cursor:
                  type: [string, 'null']
                limit:
                  type: integer
                  minimum: 1
                sortKey:
                  enum: [created_at, updated_at, recency_at]
                sortDirection:
                  enum: [asc, desc]
                archived:
                  type: boolean
                isPinned:
                  type: boolean
                cwd:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                searchTerm:
                  type: string
                parentThreadId:
                  type: string
                ancestorThreadId:
                  type: string
              additionalProperties: true
    ThreadReadRequest:
      allOf:
        - $ref: '#/components/schemas/RequestEnvelope'
        - type: object
          properties:
            method:
              const: thread/read
            params:
              type: object
              description: >-
                Reads metadata only. Codex Vault uses this request to hydrate
                runtime metadata for catalogued IDs omitted by thread/list and
                never requests turns for compatibility discovery.
              required: [threadId, includeTurns]
              properties:
                threadId:
                  type: string
                  minLength: 1
                includeTurns:
                  const: false
              additionalProperties: true
    Response:
      type: object
      required: [id]
      properties:
        id:
          oneOf:
            - type: integer
            - type: string
        result:
          type: object
        error:
          type: object
          required: [message]
          properties:
            code:
              type: integer
            message:
              type: string
          additionalProperties: true
      additionalProperties: true
    RuntimeStatus:
      type: object
      required: [type]
      properties:
        type:
          enum: [notLoaded, idle, systemError, active]
        activeFlags:
          type: array
          items:
            type: string
      additionalProperties: true
    SubAgentSource:
      oneOf:
        - enum: [review, compact, memory_consolidation]
        - type: object
          required: [thread_spawn]
          properties:
            thread_spawn:
              type: object
              required: [parent_thread_id, depth]
              properties:
                parent_thread_id:
                  type: string
                  minLength: 1
                depth:
                  type: integer
              additionalProperties: true
          additionalProperties: false
        - type: object
          required: [other]
          properties:
            other:
              type: string
          additionalProperties: false
    ThreadSource:
      oneOf:
        - enum:
            - cli
            - vscode
            - exec
            - appServer
            - subAgent
            - subAgentReview
            - subAgentCompact
            - subAgentThreadSpawn
            - subAgentOther
            - unknown
        - type: object
          required: [subAgent]
          properties:
            subAgent:
              $ref: '#/components/schemas/SubAgentSource'
          additionalProperties: true
    ThreadSummary:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: [string, 'null']
        title:
          type: [string, 'null']
        cwd:
          type: [string, 'null']
        createdAt:
          type: [integer, string]
        updatedAt:
          type: [integer, string, 'null']
        recencyAt:
          type: [integer, string, 'null']
        isPinned:
          type: [boolean, 'null']
          description: >-
            Optional app-server observation. Absence, null, or contradictory
            isPinned=true/false filter results make this source unreliable;
            callers must not default it to false.
        parentThreadId:
          type: [string, 'null']
          description: >-
            thread/list may omit this field for a sub-agent. A metadata-only
            thread/read is authoritative for hydration; disagreement remains
            ambiguous and must not be guessed.
        source:
          $ref: '#/components/schemas/ThreadSource'
        status:
          $ref: '#/components/schemas/RuntimeStatus'
      additionalProperties: true
    ThreadNotification:
      type: object
      required: [method, params]
      properties:
        method:
          enum:
            - thread/status/changed
            - thread/archived
            - thread/unarchived
            - thread/deleted
        params:
          type: object
          required: [threadId]
          properties:
            threadId:
              type: string
              minLength: 1
            status:
              $ref: '#/components/schemas/RuntimeStatus'
          additionalProperties: true
      additionalProperties: true
