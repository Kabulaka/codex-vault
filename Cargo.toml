[package]
name = "codex-vault"
version = "0.1.1"
edition = "2024"
description = "A safe local TUI for archiving, restoring, and deleting Codex session trees"
license = "MIT"
repository = "https://github.com/Kabulaka/codex-vault"
rust-version = "1.85"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"
fs2 = "0.4"
ratatui = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = "3.15"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
